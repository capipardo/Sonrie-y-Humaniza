<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de alta de empresa | Sonríe y Humaniza</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fafafa;
            color: #222;
        }

        .cabecera {
            background: #fff3cd;
            padding: 45px 20px;
            text-align: center;
            border-bottom: 1px solid #e7c85a;
        }

        .cabecera h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        .cabecera p {
            margin: 0;
            font-size: 18px;
        }

        .contenido {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .volver:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <header class="cabecera">
        <h1>Ficha de alta de empresa</h1>
        <p>Sonríe y Humaniza</p>
    </header>

    <main class="contenido">

        <div class="tarjeta">

            <h2>Personalicemos tu proyecto</h2>

            <p>
                Completa los datos disponibles para que podamos preparar
                una versión de Sonríe y Humaniza adaptada a tu empresa.
            </p>

            <p>
                Los campos que no correspondan a tu negocio podrán dejarse
                en blanco.
            </p>

            <a href="index.html#empresas" class="volver">
                ← Volver a Sonríe y Humaniza
            </a>

        </div>

    </main>

</body>
</html>
